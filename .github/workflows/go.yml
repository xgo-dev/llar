name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [qiniu, ubuntu-24.04]
    strategy:
      matrix:
        go:
          - 1.25.x
          - 1.26.x

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Go environment
        run: |
          echo "GOPATH=${RUNNER_TEMP}/go" >> "$GITHUB_ENV"
          echo "GOBIN=${RUNNER_TEMP}/go/bin" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{matrix.go}}
      - name: Download Go modules
        run: go mod download
      - name: Test Go code
        run: go test -v -ldflags="-checklinkname=0" -race -covermode atomic -coverprofile coverage.out ./...
      - name: Upload code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          disable_search: true
          files: coverage.out
