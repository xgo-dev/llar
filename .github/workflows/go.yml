name: Test
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [qiniu, ubuntu-24.04]
    strategy:
      matrix:
        go:
          - 1.25.x
          - 1.26.x

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Go environment
        run: |
          echo "GOPATH=${RUNNER_TEMP}/go" >> "$GITHUB_ENV"
          echo "GOBIN=${RUNNER_TEMP}/go/bin" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{matrix.go}}
          cache-dependency-path: |
            go.sum
            build/go.sum
            cmd/go.sum
      - name: Download Go modules
        run: go mod download
      - name: Download build modules
        working-directory: build
        run: go mod download
      - name: Download command modules
        working-directory: cmd
        run: go mod download
      - name: Check root module isolation
        run: |
          task_modules=$(go list -m -f '{{.Path}}' all)
          if printf '%s\n' "$task_modules" | grep -E '^(github.com/goplus/(llar/(build|cmd)|ixgo|xgo|gogen)|github.com/spf13/cobra|github.com/jessevdk/go-flags)$'; then
            exit 1
          fi
      - name: Test shared packages
        run: go test -v -ldflags="-checklinkname=0" -race -covermode atomic -coverprofile coverage.out ./...
      - name: Test build
        working-directory: build
        run: go test -v -ldflags="-checklinkname=0" -race -covermode atomic -coverprofile ../build-coverage.out ./...
      - name: Test command
        working-directory: cmd
        run: go test -v -ldflags="-checklinkname=0" -race -covermode atomic -coverprofile ../cmd-coverage.out ./...
      - name: Upload code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          disable_search: true
          files: coverage.out,build-coverage.out,cmd-coverage.out
